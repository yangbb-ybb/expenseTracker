<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>frontend-h5</title>
  <script>
    (function () {
      if (typeof Node === 'function' && Node.prototype) {
        var originalCloneNode = Node.prototype.cloneNode;
        Node.prototype.cloneNode = function (deep) {
          if (deep && this.hasAttribute && this.hasAttribute('i-is-hosted')) {
            return originalCloneNode.call(this, false);
          }
          return originalCloneNode.call(this, deep);
        };
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
