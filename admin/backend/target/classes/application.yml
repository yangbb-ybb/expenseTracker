# =====================================================
#  环境配置（修改这里切换环境）
# =====================================================
# 可选值：dev | test | prod
# 接手项目的人只需要修改这一行即可
#
# 环境说明：
#   - dev:  本地开发环境（127.0.0.1:3306）
#   - test: 测试环境（测试服务器）
#   - prod: 生产环境（真实数据库）
#
# 接口文档地址：
#   - Swagger UI: http://localhost:8080/api/doc.html
#   - OpenAPI: http://localhost:8080/api/v3/api-docs
#
# API 接口（小驼峰命名）：
#   - 用户登录:    POST /api/user/login
#   - 用户注册:    POST /api/user/register
#   - 用户信息:    GET  /api/user/info
#   - 余额充值:    POST /api/userBalance/recharge
#   - 余额消费:    POST /api/userBalance/consume
#   - 余额冻结:    POST /api/userBalance/freeze
#   - 余额解冻:    POST /api/userBalance/unfreeze
#   - 余额转账:    POST /api/userBalance/transfer
#   - 余额退款:    POST /api/userBalance/refund
#   - 发送验证码:  POST /api/authSms/send
#   - 短信登录:    POST /api/authLogin/sms
#   - 消费明细:    POST /api/userDailyConsumeDetail
# =====================================================

# ========== 以下是公共配置，各环境通用 ==========

spring:
  profiles:
    active: dev

  application:
    name: backend

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 配置
jwt:
  validity: 604800000           # Token 有效期（毫秒）
  renewal-threshold: 3600000      # 自动续期阈值（毫秒）

logging:
  level:
    com.example: debug
