# 开发环境配置
# 激活方式：--spring.profiles.active=dev

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地 MySQL
    url: jdbc:mysql://127.0.0.1:3306/backend?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=30000
    username: root
    password:
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 5

  data:
    redis:
      host: localhost
      port: 6379
      password:

# JWT 配置（开发环境可以短一点）
jwt:
  validity: 86400000           # 1天（毫秒），方便测试
  renewal-threshold: 1800000    # 30分钟

# 日志级别
logging:
  level:
    com.example: DEBUG         # 开发环境详细日志
