# =====================================================
#  环境配置（修改这里切换环境）
# =====================================================
# 可选值：dev | test | prod
# 接手项目的人只需要修改这一行即可
spring:
  profiles:
    active: dev

  application:
    name: backend
# =====================================================

# ========== 以下是公共配置，各环境通用 ==========

server:
  port: 8080
  servlet:
    context-path: /api

  # Redis 配置（各环境可能不同，在对应 yml 中覆盖）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 配置
jwt:
  validity: 604800000           # Token 有效期（毫秒）
  renewal-threshold: 3600000      # 自动续期阈值（毫秒）

logging:
  level:
    com.example: debug
