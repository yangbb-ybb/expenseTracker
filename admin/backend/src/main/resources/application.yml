server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/backend?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=30000
    username: root
    password:
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 配置
jwt:
  # Token 有效期（毫秒），默认 7 天
  # 7 天 = 7 * 24 * 60 * 60 * 1000 = 604800000
  validity: 604800000
  # 自动续期阈值（毫秒），默认 1 小时
  # 当 Token 剩余时间 < 此值时，自动续期
  # 1 小时 = 60 * 60 * 1000 = 3600000
  renewal-threshold: 3600000

logging:
  level:
    com.example: debug
